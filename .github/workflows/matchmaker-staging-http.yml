name: Den Matchmaker staging HTTP smoke (read only)
on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/den-matchmaker-mvp-2026-11-18'
    paths:
      - '.github/workflows/matchmaker-staging-http.yml'
      - 'supabase/functions/den-matchmaker/**'
      - 'matchmaker/staging-health.mjs'
      # Exercise the real hosted endpoint when ANY bundled runtime code changes,
      # not only when the function entrypoint or health-only route changes.
      - 'matchmaker/server-composition.mjs'
      - 'matchmaker/postgres-store-adapter.mjs'
      - 'matchmaker/matchmaker-core.mjs'
      - 'matchmaker/command-dispatcher.mjs'
      - 'matchmaker/http-handler.mjs'
      - 'matchmaker/discord-webcrypto-verifier.mjs'
      - 'matchmaker/response-timing.mjs'
      - 'matchmaker/staging-runtime-config.mjs'
permissions:
  contents: read
jobs:
  staging-http:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify hosted staging health without authentication or DB writes
        env:
          STAGING_URL: https://tcxktyqywsqafnyxhpgy.supabase.co/functions/v1/den-matchmaker
        run: |
          set -euo pipefail
          test "${STAGING_URL}" != "https://cpjcjcxinhjusosaguyi.supabase.co/functions/v1/den-matchmaker"
          code=$(curl --silent --show-error --max-time 18 --retry 2 --output /tmp/den_health.json --write-out '%{http_code}' "${STAGING_URL}/health")
          test "$code" = "200"
          python3 - <<'PY'
          import json
          with open('/tmp/den_health.json') as f: data=json.load(f)
          # Authorized tester commands may be active in isolated staging.
          # A staging smoke must still reject public posting or data exposure.
          assert data.get('service') == 'den-matchmaker', data
          assert data.get('environment') == 'staging', data
          assert data.get('status') in ('commands_disabled','commands_enabled'), data
          assert data.get('posting_enabled') is False, data
          assert data.get('member_data_access') is False, data
          assert set(data) == {'service','environment','status','posting_enabled','member_data_access'}, data
          print('PASS: real hosted staging health GET, no database writes')
          PY
      - name: Verify unsigned POST fails closed with configured signing key
        env:
          STAGING_URL: https://tcxktyqywsqafnyxhpgy.supabase.co/functions/v1/den-matchmaker
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --max-time 18 --output /tmp/den_noauth.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$STAGING_URL")
          test "$code" = "401"
          python3 - <<'PY'
          import json
          with open('/tmp/den_noauth.json') as f: data=json.load(f)
          assert data == {'error':'Unauthorized'}, data
          print('PASS: unsigned POST rejected with 401; no command executed')
          PY
      - name: Verify forged Discord-style signature is denied (no replay claim)
        env:
          STAGING_URL: https://tcxktyqywsqafnyxhpgy.supabase.co/functions/v1/den-matchmaker
        run: |
          set -euo pipefail
          # A forged signature must be rejected BEFORE the private DB replay claimant.
          # Synthetic interaction ID is invalidly signed and never processed.
          timestamp=$(date +%s)
          signature=$(printf '0%.0s' {1..128})
          code=$(curl --silent --show-error --max-time 18 --output /tmp/den_forged.json --write-out '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "x-signature-timestamp: ${timestamp}" \
            -H "x-signature-ed25519: ${signature}" \
            --data '{"id":"1546529501859815438","type":1}' "${STAGING_URL}")
          test "$code" = "401"
          python3 - <<'PY'
          import json
          with open('/tmp/den_forged.json') as f: data=json.load(f)
          assert data == {'error':'Unauthorized'}, data
          print('PASS: forged signed-looking Discord PING rejected by hosted Edge')
          PY
