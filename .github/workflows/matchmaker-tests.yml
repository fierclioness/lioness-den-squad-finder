name: Den Matchmaker core tests
on:
  pull_request:
    paths:
      - 'matchmaker/**'
      - '.github/workflows/matchmaker-tests.yml'
  push:
    branches:
      - 'feature/den-matchmaker-mvp-2026-11-18'
    paths:
      - 'matchmaker/**'
      - '.github/workflows/matchmaker-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test matchmaker/matchmaker-core.test.mjs
